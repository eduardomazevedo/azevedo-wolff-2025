schema_version: 1
paper: Broad Validity of the First-Order Approach in Moral Hazard
units: USD_1000

# Timing results are deliberately refreshed only on the designated standard
# server. They are the only generated numerical outputs committed to Git.
controlled_benchmark_inputs:
  - output/timing_results.csv
  - output/machine_specs.txt

# This is the authoritative inventory during migration. `current` assets are
# already referenced by TeX. `pending` assets are approved for the paper and
# will become current when their captions and TeX placement are added.
assets:
  gaussian_principal:
    kind: figure
    status: current
    output: figures/log-gaussian-sigma=50.0/pp_stacked.pdf
    tex_path: figures/log-gaussian-sigma=50.0/pp_stacked.pdf
    tex_source: tex/introduction.tex
  gaussian_pareto:
    kind: figure
    status: current
    output: figures/log-gaussian-sigma=50.0/pareto_frontier.pdf
    tex_path: figures/log-gaussian-sigma=50.0/pareto_frontier.pdf
    tex_source: tex/proof-main-result.tex
  gaussian_fixed_action:
    kind: figure
    status: current
    output: figures/log-gaussian-sigma=50.0/cm_stacked.pdf
    tex_path: figures/log-gaussian-sigma=50.0/cm_stacked.pdf
    tex_source: tex/proof-main-result.tex
  poisson_principal:
    kind: figure
    status: current
    output: figures/log-poisson/pp_stacked.pdf
    tex_path: figures/log-poisson/pp_stacked.pdf
    tex_source: tex/examples.tex
  cara_gaussian_principal:
    kind: figure
    status: current
    output: figures/cara-gaussian-sigma=50.0/pp_stacked.pdf
    tex_path: figures/cara-gaussian-sigma=50.0/pp_stacked.pdf
    tex_source: tex/examples.tex
  student_t_principal:
    kind: figure
    status: current
    output: figures/log-t-sigma=20.0/pp_stacked.pdf
    tex_path: figures/log-t-sigma=20.0/pp_stacked.pdf
    tex_source: tex/counter-examples.tex
  solver_comparison:
    kind: figure
    status: current
    output: figures/solver_comparison/stacked_comparison.pdf
    tex_path: figures/solver_comparison/stacked_comparison.pdf
    tex_source: tex/numerical-methods.tex
  benchmark_machine_description:
    kind: tex
    status: current
    output: output/specs_description.tex
    tex_path: ../output/specs_description.tex
    tex_source: tex/si.tex
    inputs: [output/machine_specs.txt]
  benchmark_table:
    kind: tex
    status: current
    output: output/benchmarks_table.tex
    tex_path: ../output/benchmarks_table.tex
    tex_source: tex/si.tex
    inputs: [output/timing_results.csv]
  foa_principal_summary:
    kind: figure
    status: pending
    output: figures/foa-principal-summary.pdf
    calculation: foa_paper_results
  foa_fixed_action_summary:
    kind: figure
    status: pending
    output: figures/foa-fixed-action-summary.pdf
    calculation: foa_paper_results

# Shared ordering for both approved FOA summaries. Fixed-action-only rows are
# inserted after the baseline without duplicating the common paper selection.
foa_summary:
  rows:
    - {kind: header, label: Gaussian}
    - {kind: data, label: "Baseline (log, σ = 50)", spec: gaussian_log_paper}
    - {kind: subheader, label: Risk aversion}
    - {kind: data, label: "CRRA γ = 0.25", spec: gaussian_crra__gamma-0.25}
    - {kind: data, label: "CRRA γ = 0.50", spec: gaussian_crra__gamma-0.5}
    - {kind: data, label: "CRRA γ = 1.50", spec: gaussian_crra__gamma-1.5}
    - {kind: data, label: "CRRA γ = 2", spec: gaussian_crra__gamma-2}
    - {kind: data, label: "CARA RRA = 0.25", spec: gaussian_cara__alpha-0.005}
    - {kind: data, label: "CARA RRA = 0.50", spec: gaussian_cara__alpha-0.01}
    - {kind: data, label: "CARA RRA = 1", spec: gaussian_cara__alpha-0.02}
    - {kind: data, label: "CARA RRA = 2", spec: gaussian_cara__alpha-0.04}
    - {kind: subheader, label: Noise}
    - {kind: data, label: "σ = 10", spec: gaussian_sigma_log__sigma-10}
    - {kind: data, label: "σ = 20", spec: gaussian_sigma_log__sigma-20}
    - {kind: subheader, label: Initial wealth}
    - {kind: data, label: "w₀ = 25", spec: gaussian_wealth_log__wealth-25}
    - {kind: data, label: "w₀ = 100", spec: gaussian_wealth_log__wealth-100}
    - {kind: data, label: "w₀ = 200", spec: gaussian_wealth_log__wealth-200}
    - {kind: subheader, label: Effort cost}
    - {kind: data, label: Half cost, spec: gaussian_cost_log__cost_scale-0.5}
    - {kind: data, label: Double cost, spec: gaussian_cost_log__cost_scale-2}
    - {kind: data_bold, label: Poisson, spec: poisson_log_paper}
    - {kind: data_bold, label: Exponential, spec: exponential_log_baseline}
    - {kind: data_bold, label: "Gamma (shape = 2)", spec: gamma2_log_baseline}
    - {kind: data_bold, label: Geometric, spec: geometric_log_baseline}
    - {kind: data_bold, label: Bernoulli, spec: bernoulli_log_baseline}
    - {kind: data_bold, label: "Binomial (n = 10)", spec: binomial10_log_baseline}
    - {kind: header, label: "Student-t (empty safe region)"}
    - {kind: data, label: "Baseline (σ = 20)", spec: student_t_log_adverse}
    - {kind: data, label: "σ = 10", spec: student_t_sigma_log__sigma-10}
    - {kind: data, label: "σ = 50", spec: student_t_sigma_log__sigma-50}
  fixed_action_insertions:
    after: gaussian_log_paper
    rows:
      - {kind: subheader, label: Intended action}
      - {kind: data, label: Low, spec: gaussian_fixed_actions_log__intended_action-70}
      - {kind: data, label: Near monopsony, spec: gaussian_fixed_actions_log__intended_action-130}

# Calculation declarations will replace the current script-level entry points.
# The first migration target is the pair of approved FOA summaries.
calculations:
  foa_paper_results:
    kind: foa_summary_bundle
    source_manifest: experiments/foa_experiments.yaml
    principal_asset: foa_principal_summary
    fixed_action_asset: foa_fixed_action_summary
