schema_version: 1
experiment_id: foa-paper-v1
units: USD_1000

# Exact economic cases and numerical settings used by the two FOA paper summaries.
numerics:
  full_ic_iterations: 100
  incentive_capacity:
    grid_points: 257
    safety_fraction: 0.001
  deviation:
    coarse_action_points: 241
    multistart_count: 12
    valid_tolerance_ce: 0.0001
    invalid_tolerance_ce: 0.001
  # Diagnostic bisection of intervals with strictly valid/invalid endpoints.
  # The figures use the computed points to form a display boundary; they do
  # not report this wage tolerance as precision for an estimated transition.
  threshold:
    wage_tolerance: 0.025
    max_iterations: 12
  validation:
    # Selected inner-problem checks only; these are paper-selected checks.
    crosscheck_transitions: true
    cvxpy_action_points: 121
    objective_tolerance: 0.02
    foc_tolerance: 0.00001
  support:
    mass_tolerance: 0.000001
    score_mean_tolerance: 0.000001
    max_expansions: 5
    expansion_factor: 1.5
    check_transition_contracts: true
    contract_variants: [baseline, dense, expanded_dense]
    contract_expansion_factor: 1.5
    contract_wage_tolerance: 0.02
  safe_region:
    action_points: 181
    derivative_step: 0.001
    faa_tolerance: 1.0e-12
    convergence_action_points: [91, 181, 361]
    convergence_derivative_steps: [0.01, 0.001, 0.0001]
    convergence_cutoff_tolerance: 1.0e-6
    convergence_relative_tolerance: 0.01
  monopsony:
    # The relaxed lambda=0 benchmark is disabled because prior checks showed
    # that it is far below true monopsony and commonly boundary-driven.
    compute_relaxed_lambda_zero: false
    # Descending requirements make it possible to verify a slack-IR plateau.
    candidate_reservation_wages: [-1, -5, -10, -20, -30, -40]
    max_downward_extensions: 4
    downward_step: 2
    # Keep log/CRRA consumption strictly positive at the lower search limit.
    minimum_reservation_wage: -49
    lambda_tolerance: 0.000001
    ir_slack_ce_tolerance: 0.01
    action_tolerance: 0.01
    profit_tolerance: 0.01
    expected_wage_tolerance: 0.01
    ce_tolerance: 0.01

# Exact paper selection, ordering, and labels for both FOA summary figures.
# Fixed-action-only rows are inserted without duplicating the common selection.
foa_summary:
  rows:
    - {kind: header, label: Gaussian}
    - {kind: data, label: "Baseline (log, σ = 50)", spec: gaussian_log_paper}
    - {kind: subheader, label: Risk aversion}
    - {kind: data, label: "CRRA γ = 0.25", spec: gaussian_crra__gamma-0.25}
    - {kind: data, label: "CRRA γ = 0.50", spec: gaussian_crra__gamma-0.5}
    - {kind: data, label: "CRRA γ = 1.50", spec: gaussian_crra__gamma-1.5}
    - {kind: data, label: "CRRA γ = 2", spec: gaussian_crra__gamma-2}
    - {kind: data, label: "CARA RRA = 0.25", spec: gaussian_cara__alpha-0.005}
    - {kind: data, label: "CARA RRA = 0.50", spec: gaussian_cara__alpha-0.01}
    - {kind: data, label: "CARA RRA = 1", spec: gaussian_cara__alpha-0.02}
    - {kind: data, label: "CARA RRA = 2", spec: gaussian_cara__alpha-0.04}
    - {kind: subheader, label: Noise}
    - {kind: data, label: "σ = 10", spec: gaussian_sigma_log__sigma-10}
    - {kind: data, label: "σ = 20", spec: gaussian_sigma_log__sigma-20}
    - {kind: subheader, label: Initial wealth}
    - {kind: data, label: "w₀ = 25", spec: gaussian_wealth_log__wealth-25}
    - {kind: data, label: "w₀ = 100", spec: gaussian_wealth_log__wealth-100}
    - {kind: data, label: "w₀ = 200", spec: gaussian_wealth_log__wealth-200}
    - {kind: subheader, label: Effort cost}
    - {kind: data, label: Half cost, spec: gaussian_cost_log__cost_scale-0.5}
    - {kind: data, label: Double cost, spec: gaussian_cost_log__cost_scale-2}
    - {kind: data_bold, label: Poisson, spec: poisson_log_paper}
    - {kind: data_bold, label: Exponential, spec: exponential_log_baseline}
    - {kind: data_bold, label: "Gamma (shape = 2)", spec: gamma2_log_baseline}
    - {kind: data_bold, label: Geometric, spec: geometric_log_baseline}
    - {kind: data_bold, label: Bernoulli, spec: bernoulli_log_baseline}
    - {kind: data_bold, label: "Binomial (n = 10)", spec: binomial10_log_baseline}
    - {kind: header, label: "Student-t (empty safe region)"}
    - {kind: data, label: "Baseline (σ = 20)", spec: student_t_log_adverse}
    - {kind: data, label: "σ = 10", spec: student_t_sigma_log__sigma-10}
    - {kind: data, label: "σ = 50", spec: student_t_sigma_log__sigma-50}
  fixed_action_insertions:
    after: gaussian_log_paper
    rows:
      - {kind: subheader, label: Intended action}
      - {kind: data, label: Low, spec: gaussian_fixed_actions_log__intended_action-70}
      - {kind: data, label: Near monopsony, spec: gaussian_fixed_actions_log__intended_action-130}

cases:
  - id: gaussian_log_paper
    initial_wealth: 50
    target_action: 100
    fixed_action: 100
    action_bounds: [0, 180]
    revenue_slope: 1
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: gaussian
      params:
        sigma: 50
    outcome_grid:
      distribution_type: continuous
      y_min: -300
      y_max: 480
      n: 201
    reservation_wages: [0, 0.5, 1, 5, 15]
    exercises: [principal, fixed_action]

  - id: poisson_log_paper
    initial_wealth: 50
    target_action: 7
    fixed_action: 7
    action_bounds: [0.05, 10]
    revenue_slope: 15
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: poisson
      params: {}
    outcome_grid:
      distribution_type: discrete
      y_min: 0
      y_max: 28
      step_size: 1
    reservation_wages: [0, 0.125, 0.5, 2, 5]
    exercises: [principal, fixed_action]

  - id: exponential_log_baseline
    initial_wealth: 50
    target_action: 100
    fixed_action: 100
    action_bounds: [10, 180]
    revenue_slope: 1
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: exponential
      params: {}
    outcome_grid:
      distribution_type: continuous
      y_min: 0
      y_max: 300
      n: 301
    reservation_wages: [0, 0.05, 0.25, 1, 5, 15, 50, 100]
    exercises: [principal, fixed_action]

  - id: gamma2_log_baseline
    initial_wealth: 50
    target_action: 50
    fixed_action: 50
    action_bounds: [5, 90]
    revenue_slope: 2
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: gamma
      params:
        n: 2
    outcome_grid:
      distribution_type: continuous
      y_min: 0.001
      y_max: 500
      # Resolve both the target scale and the much tighter zero-cost scale a=5.
      n: 1201
    reservation_wages: [0, 0.5, 1, 5, 15, 50]
    exercises: [principal, fixed_action]

  - id: geometric_log_baseline
    initial_wealth: 50
    target_action: 7
    fixed_action: 7
    action_bounds: [1.05, 10]
    revenue_slope: 15
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: geometric
      params: {}
    outcome_grid:
      distribution_type: discrete
      y_min: 1
      y_max: 100
      step_size: 1
    reservation_wages: [0, 0.125, 0.5, 2, 5]
    exercises: [principal, fixed_action]

  - id: bernoulli_log_baseline
    initial_wealth: 50
    target_action: 0.7
    fixed_action: 0.7
    action_bounds: [0.05, 0.95]
    revenue_slope: 150
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: bernoulli
      params: {}
    outcome_grid:
      distribution_type: discrete
      y_min: 0
      y_max: 1
      step_size: 1
    reservation_wages: [0, 0.125, 0.5, 2, 5]
    exercises: [principal, fixed_action]

  - id: binomial10_log_baseline
    initial_wealth: 50
    target_action: 0.7
    fixed_action: 0.7
    action_bounds: [0.05, 0.99]
    revenue_slope: 150
    cost_normalization: paper_log
    # Ten output signals make incentives unusually cheap; this steeper cost
    # keeps the endogenous success probability interior and near the 0.7 target.
    cost_scale: 1.5
    utility:
      kind: log
    distribution:
      kind: binomial
      params:
        n: 10
    outcome_grid:
      distribution_type: discrete
      y_min: 0
      y_max: 10
      step_size: 1
    reservation_wages: [0, 0.125, 0.5, 2, 5]
    exercises: [principal, fixed_action]

  # Student-t comparison: the fixed-action relaxed contract should fail
  # global IC throughout this range.
  - id: student_t_log_adverse
    compute_monopsony: false
    initial_wealth: 50
    target_action: 100
    fixed_action: 100
    action_bounds: [0, 180]
    revenue_slope: 1
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: student_t
      params:
        sigma: 20
        nu: 1.15
    outcome_grid:
      distribution_type: continuous
      y_min: -200
      y_max: 380
      n: 301
    reservation_wages: [0, 20, 50, 100]
    exercises: [principal, fixed_action]

  - id: student_t_sigma_log__sigma-10
    compute_monopsony: false
    initial_wealth: 50
    target_action: 100
    fixed_action: 100
    action_bounds: [0, 180]
    revenue_slope: 1
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: student_t
      params:
        sigma: 10
        nu: 1.15
    outcome_grid:
      distribution_type: continuous
      y_min: -100
      y_max: 280
      n: 301
    reservation_wages: [0, 20, 50, 100]
    exercises: [principal, fixed_action]

  - id: student_t_sigma_log__sigma-50
    compute_monopsony: false
    initial_wealth: 50
    target_action: 100
    fixed_action: 100
    action_bounds: [0, 180]
    revenue_slope: 1
    cost_normalization: paper_log
    utility:
      kind: log
    distribution:
      kind: student_t
      params:
        sigma: 50
        nu: 1.15
    outcome_grid:
      distribution_type: continuous
      y_min: -500
      y_max: 680
      n: 301
    reservation_wages: [0, 20, 50, 100]
    exercises: [principal, fixed_action]

case_families:
  - id: gaussian_sigma_log
    base: &gaussian_log_family_base
      initial_wealth: 50
      target_action: 100
      fixed_action: 100
      action_bounds: [0, 180]
      revenue_slope: 1
      cost_normalization: local_consumption_equivalent
      utility: {kind: log}
      distribution: {kind: gaussian, params: {sigma: 50}}
      outcome_grid: {distribution_type: continuous, y_min: -300, y_max: 480, n: 201}
      reservation_wages: [0, 0.5, 1, 5, 15]
      exercises: [principal, fixed_action]
    axes:
      - name: sigma
        path: distribution.params.sigma
        values: [10, 20]

  - id: gaussian_wealth_log
    base: *gaussian_log_family_base
    axes:
      - name: wealth
        path: initial_wealth
        values: [25, 100, 200]

  - id: gaussian_cost_log
    base: &gaussian_wide_action_base
      <<: *gaussian_log_family_base
      action_bounds: [0, 250]
      outcome_grid: {distribution_type: continuous, y_min: -300, y_max: 550, n: 219}
    axes:
      - name: cost_scale
        path: cost_scale
        values: [0.5]

  - id: gaussian_cost_log
    base: *gaussian_log_family_base
    axes:
      - name: cost_scale
        path: cost_scale
        values: [2]

  - id: gaussian_fixed_actions_log
    base:
      <<: *gaussian_log_family_base
      compute_monopsony: false
      exercises: [fixed_action]
    axes:
      - name: intended_action
        path: fixed_action
        values: [70, 130]

  - id: gaussian_crra
    base:
      <<: *gaussian_wide_action_base
      utility: {kind: crra, gamma: 0.5}
    axes:
      - name: gamma
        path: utility.gamma
        values: [0.25, 0.5]

  - id: gaussian_crra
    base:
      <<: *gaussian_log_family_base
      utility: {kind: crra, gamma: 1.5}
    axes:
      - name: gamma
        path: utility.gamma
        values: [1.5, 2]

  - id: gaussian_cara
    base:
      <<: *gaussian_wide_action_base
      utility: {kind: cara, alpha: 0.005}
      risk_aversion_calibration:
        reference_total_wealth: 50
        formula: alpha_times_reference_total_wealth
    axes:
      - name: alpha
        path: utility.alpha
        values: [0.005]

  - id: gaussian_cara
    base:
      <<: *gaussian_log_family_base
      utility: {kind: cara, alpha: 0.02}
      risk_aversion_calibration:
        reference_total_wealth: 50
        formula: alpha_times_reference_total_wealth
    axes:
      - name: alpha
        path: utility.alpha
        # These imply RRA 0.5, 1, and 2 at reference wealth 50.
        values: [0.01, 0.02, 0.04]
